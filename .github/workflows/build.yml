name: Build ClipForge (Android APK + web app)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Bundle the web app into the APK
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/www
          cp -r www android/app/src/main/assets/www
          rm -f android/app/src/main/assets/www/{Start-ClipForge.bat,serve.ps1,start.sh,sw.js}
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.CLIPFORGE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/clipforge.jks"
            echo "CLIPFORGE_KEYSTORE=$RUNNER_TEMP/clipforge.jks" >> "$GITHUB_ENV"
            echo "CLIPFORGE_KS_PASS=${{ secrets.CLIPFORGE_KS_PASS }}" >> "$GITHUB_ENV"
          else
            # personal app: the signing key lives in the repo so every build can update the installed app
            echo "CLIPFORGE_KEYSTORE=$GITHUB_WORKSPACE/android/signing/clipforge.jks" >> "$GITHUB_ENV"
            echo "CLIPFORGE_KS_PASS=$(cat android/signing/password.txt)" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: Name the APK
        id: name
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          cp android/app/build/outputs/apk/release/app-release.apk "ClipForge-v$VER.apk"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          ls -la ClipForge-*.apk
      - uses: actions/upload-artifact@v4
        with: { name: ClipForge-apk, path: ClipForge-*.apk }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.name.outputs.ver }}
          name: ClipForge v${{ steps.name.outputs.ver }}
          make_latest: true
          files: ClipForge-*.apk
          body: |
            **Install on Android:** download `ClipForge-v${{ steps.name.outputs.ver }}.apk` below on your phone, open it, allow "Install unknown apps" for your browser/Files app when asked, then tap Install.
            Works fully offline. Web version: https://kjaf1978-cmr.github.io/clipforge/

  pages:
    runs-on: ubuntu-latest
    continue-on-error: true   # needs Settings → Pages → Source "GitHub Actions"; never blocks the APK
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4
