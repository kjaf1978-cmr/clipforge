plugins { id 'com.android.application' }

def ksFile = System.getenv("CLIPFORGE_KEYSTORE")

android {
    namespace 'de.jules.clipforge'
    compileSdk 34
    defaultConfig {
        applicationId "de.jules.clipforge"
        minSdk 24
        targetSdk 34
        versionCode (System.getenv("VERSION_CODE") ? System.getenv("VERSION_CODE").toInteger() : 1)
        versionName "1.1.0"
    }
    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv("CLIPFORGE_KS_PASS")
                keyAlias "clipforge"
                keyPassword System.getenv("CLIPFORGE_KS_PASS")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // the FFmpeg engine (.wasm) is already compressed; storing it uncompressed keeps loading fast
    androidResources { noCompress += ['wasm'] }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
